http:
  routers:
    metin2-http:
      entryPoints:
        - http
      rule: Host(`metin2.kaanakin.dev`)
      middlewares:
        - metin2-cloudflare-only
        - metin2-to-https
      service: metin2-portal
    metin2-portal:
      entryPoints:
        - https
      rule: Host(`metin2.kaanakin.dev`)
      priority: 10
      middlewares:
        - metin2-cloudflare-only
      service: metin2-portal
      tls:
        certresolver: letsencrypt
    metin2-game:
      entryPoints:
        - https
      rule: Host(`metin2.kaanakin.dev`) && (PathPrefix(`/client.`) || Path(`/preload.js`) || Path(`/sw.js`) || PathPrefix(`/corpus/`) || PathPrefix(`/asan/`))
      priority: 50
      middlewares:
        - metin2-cloudflare-only
      service: metin2-site
      tls:
        certresolver: letsencrypt
    metin2-bridge:
      entryPoints:
        - https
      rule: Host(`metin2.kaanakin.dev`) && PathPrefix(`/to/`)
      priority: 100
      middlewares:
        - metin2-cloudflare-only
      service: metin2-bridge
      tls:
        certresolver: letsencrypt

  services:
    metin2-portal:
      loadBalancer:
        servers:
          - url: "http://10.0.1.1:11497"
    metin2-site:
      loadBalancer:
        servers:
          - url: "http://m2web-site:80"
    metin2-bridge:
      loadBalancer:
        servers:
          - url: "http://10.0.1.1:11496"

  middlewares:
    metin2-to-https:
      redirectScheme:
        scheme: https
        permanent: true
    # The portal trusts CF-Connecting-IP for its rate limits, so nothing may
    # reach these routers except Cloudflare. Ranges: GET /client/v4/ips.
    metin2-cloudflare-only:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/32
