<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Metin2</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ccc;font:13px/1.5 system-ui,sans-serif}
canvas#canvas{display:block;width:100%;height:100%;outline:0}
#status{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;color:#e8d9b8;text-shadow:0 1px 3px #000}
#status.done{display:none}
#m2w_error{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:30}
#m2w_error.visible{display:flex}
#m2w_error div{max-width:min(92vw,560px);background:#16130f;border:1px solid #3a2f22;border-radius:10px;padding:22px 26px;color:#e8d9b8}
#m2w_error pre{white-space:pre-wrap;color:#9a8f7c;font:12px/1.4 ui-monospace,monospace;max-height:40vh;overflow:auto}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Metin2" oncontextmenu="event.preventDefault()"></canvas>
<details id="m2w_help" style="position:fixed;top:10px;left:10px;z-index:25;max-width:min(85vw,420px);padding:8px 12px;background:#16130fee;border:1px solid #67533b;border-radius:8px"><summary id="m2w_help_title">Controls</summary><p id="m2w_help_text"></p></details>
<div id="status">loading…</div>
<div id="m2w_error"><div><b>The client has stopped.</b><pre id="m2w_error_text"></pre>Reload the page to start again.</div></div>
<script>
// The client shell - OURS, minimal. No
// counting of GL calls or other instrumentation on the hot path
// (the lesson: a counter in the shell slowed the client down 60x).
// The client itself reads the URL parameters (compat/runtime.js, m2w.options):
// ?scale, ?return, ?bridge, ?lang, ?deflang, ?fps, ?corpusMB, ?noprefetch,
// ?nofetch.
// m2w.config.bridge = the address of the WebSocket bridge (wss://host[:port]). Empty = the
// same server as the page (/to/...). Filled in by link_client.py from build/port/private/bridge.txt.
window.m2w = { config: { bridge: "__BRIDGE__" } };
var statusEl = document.getElementById("status");
/// Login handed over by the portal (web/portal src/lib/launch.ts): read once and
/// removed at once; introLogin.py reads /m2w_autologin and deletes it.
var autoLogin = (function () {
  try {
    var raw = sessionStorage.getItem("m2w.autologin");
    sessionStorage.removeItem("m2w.autologin");
    var v = raw && JSON.parse(raw);
    if (v && v.expires > Date.now() && v.login && v.password) return v.login + "\n" + v.password + "\n";
  } catch (e) { }
  return null;
})();
var Module = {
  preRun: [function () {
    if (autoLogin) Module.FS.writeFile("/m2w_autologin", autoLogin);
    autoLogin = null;
    Module.addRunDependency('m2w-login-ready');
    var retry = document.createElement('button');
    retry.textContent = m2w.config.lang === 'tr' ? 'Yeniden dene' : 'Retry';
    retry.style.cssText = 'position:fixed;top:60%;left:50%;transform:translateX(-50%);z-index:31;display:none;padding:10px 20px';
    document.body.appendChild(retry);
    function prepare() {
      retry.style.display = 'none';
      m2w.prepareStartup().then(function () {
        retry.remove();
        Module.removeRunDependency('m2w-login-ready');
      }, function () {
        statusEl.className = '';
        statusEl.textContent = m2w.config.lang === 'tr' ? 'Giriş verileri indirilemedi. Bağlantını kontrol edip yeniden dene.' : 'Login data could not be downloaded. Check your connection and retry.';
        retry.style.display = 'block';
      });
    }
    retry.onclick = prepare;
    prepare();
  }],
  /// Engine files get `?v=<build time>`, so a new build is never served from cache.
  locateFile: function (p) { return p + "?v=__VERSION__"; },
  canvas: document.getElementById("canvas"),
  /// Engine start-up text in the middle of the screen; empty = hide it.
  setStatus: function (t) {
    if (!statusEl) return;
    statusEl.textContent = t;
    if (!t) statusEl.className = "done";
  },
  /// Engine stdout to the browser console.
  print: function (t) { console.log(t); },
  /// Engine stderr to the browser console as errors.
  printErr: function (t) { console.error(t); },
  /// The engine stopped: shows the error overlay with the reason.
  onAbort: function (what) {
    var e = document.getElementById("m2w_error");
    document.getElementById("m2w_error_text").textContent = String(what);
    e.className = "visible";
  }
};
window.addEventListener("error", function (ev) {
  if (ev && ev.message && /RuntimeError|abort|unreachable/.test(ev.message)) Module.onAbort(ev.message);
});
/// Each language is its own package (link_client.py), so the page picks the
/// language before the engine starts - in the order of compat/runtime.js
/// m2w.browserLanguage, which then takes m2w.config.lang as given.
(function () {
  var packaged = "__LANGUAGES__".split(",").filter(Boolean);
  var FROM_BROWSER = { cs: "cz", da: "dk", el: "gr" };
  var params = new URLSearchParams(location.search);
  var pick = function (s) {
    s = String(s || "").toLowerCase().split("-")[0];
    s = FROM_BROWSER[s] || s;
    return packaged.indexOf(s) >= 0 ? s : "";
  };
  var lang = pick(params.get("lang"));
  if (lang) { try { localStorage.setItem("m2/lang", lang); } catch (e) { } }
  if (!lang) { try { lang = pick(localStorage.getItem("m2/lang")); } catch (e) { } }
  if (!lang) lang = pick(params.get("deflang"));
  if (!lang) (navigator.languages || [navigator.language]).forEach(function (l) { lang = lang || pick(l); });
  if (!lang) lang = pick("en") || packaged[0] || "";
  window.m2w.config.lang = lang;
document.documentElement.lang = lang;
document.getElementById('m2w_help_title').textContent = lang === 'tr' ? 'Kontroller ve giriş yardımı' : 'Controls and sign-in help';
var mac = /Mac|iPhone|iPad/.test(navigator.platform || '');
document.getElementById('m2w_help_text').textContent = lang === 'tr'
  ? 'Tab / Shift+Tab: kullanıcı adı ve şifre arasında geçiş. Enter: giriş. Disk simgesi yalnız kullanıcı adını hatırlar; şifre saklanmaz. F1–F4: hatırlanan kullanıcı adını doldurur. ' + (mac ? 'Mac: ayarına göre Fn/🌐 + F1–F4 kullan. Sağ tık için iki parmakla tıkla. ⌘ kısayolları tarayıcıya aittir.' : 'Kısayollar yerine hesap alanlarına tıklayabilirsin. Ctrl+L ve Ctrl+R tarayıcıya aittir.')
  : 'Tab / Shift+Tab: switch username and password. Enter: sign in. The disk icon remembers only the username; passwords are not saved. F1–F4: fill a saved username. ' + (mac ? 'Mac: depending on keyboard settings, use Fn/🌐 + F1–F4. Use a two-finger click for right-click. ⌘ shortcuts belong to the browser.' : 'You can click the account slots instead. Ctrl+L and Ctrl+R belong to the browser.');
  var scripts = (lang ? ["client.locale_" + lang + ".js"] : []).concat(["client.js"]);
  scripts.forEach(function (src) {
    var s = document.createElement("script");
    s.src = src + "?v=__VERSION__";
    s.async = false;
    document.body.appendChild(s);
  });
})();
</script>
<script src="preload.js?v=__VERSION__"></script>
</body>
</html>
